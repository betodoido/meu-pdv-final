<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Painel Caixa - MenuDino PDV</title><script src="https://tailwindcss.com"></script><link href="https://googleapis.com" rel="stylesheet"><style>body{font-family:'Inter',sans-serif;}</style></head>
<body class="bg-slate-100 p-6 text-slate-800">
    <div class="max-w-6xl mx-auto space-y-4">
        <header class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
            <div>
                <h1 class="text-xl font-black text-slate-900 tracking-tight">💻 Monitor PDV Integrado (MenuDino)</h1>
                <p class="text-xs text-slate-400 mt-0.5">Gestão de cozinha e entrega automática</p>
            </div>
            <button onclick="load()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-5 py-2.5 rounded-xl text-xs">🔄 Sincronizar Caixa</button>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h2 class="font-extrabold text-xs uppercase tracking-wider text-blue-600 border-b pb-2">🍳 Cozinha / Preparo</h2><div id="c-preparo" class="space-y-2"></div></div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h2 class="font-extrabold text-xs uppercase tracking-wider text-orange-500 border-b pb-2">🛵 Despachados</h2><div id="c-rota" class="space-y-2"></div></div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h2 class="font-extrabold text-xs uppercase tracking-wider text-emerald-600 border-b pb-2">✅ Concluídos</h2><div id="c-concluido" class="space-y-2"></div></div>
        </div>
    </div>
    <script>
        async function load() {
            const r = await fetch('/api/pedidos'); const peds = await r.json();
            const divP = document.getElementById('c-preparo'), divR = document.getElementById('c-rota'), divC = document.getElementById('c-concluido');
            divP.innerHTML = ""; divR.innerHTML = ""; divC.innerHTML = "";
            peds.forEach(p => {
                const card = document.createElement('div'); card.className = "bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-col justify-between shadow-sm";
                let btn = "";
                if(p.status === 'Pendente') btn = `<button onclick="status(${p.id},'Em Preparo')" class="mt-3 w-full bg-blue-600 text-white font-bold py-2 rounded-lg text-xs uppercase tracking-wide">Aceitar</button>`;
                else if(p.status === 'Em Preparo') btn = `<button onclick="status(${p.id},'Saiu para Entrega')" class="mt-3 w-full bg-orange-500 text-white text-xs py-2 rounded-lg text-xs uppercase tracking-wide">Despachar 🛵</button>`;
                else if(p.status === 'Saiu para Entrega') btn = `<button onclick="status(${p.id},'Entregue')" class="mt-3 w-full bg-emerald-600 text-white text-xs py-2 rounded-lg text-xs uppercase tracking-wide">Finalizar ✅</button>`;
                
                card.innerHTML = `<div class="flex justify-between font-black text-xs text-gray-900"><span>#${p.id} - ${p.cliente_nome}</span><span class="text-emerald-600">R$ ${p.total.toFixed(2)}</span></div><p class="text-[11px] text-slate-500 font-semibold mt-1">📱 ${p.cliente_whatsapp}</p><p class="text-[11px] text-slate-400 mt-0.5 leading-tight italic">📍 ${p.endereco_entrega}</p>${btn}`;
                if(p.status==='Pendente'||p.status==='Em Preparo') divP.appendChild(card);
                if(p.status==='Saiu para Entrega') divR.appendChild(card);
                if(p.status==='Entregue') { card.className="bg-emerald-50 text-xs text-slate-600 p-3 rounded-xl border flex justify-between items-center"; card.innerHTML=`<span>🛒 <b>#${p.id}</b> - ${p.cliente_nome}</span> <span class="font-extrabold text-emerald-700">R$ ${p.total.toFixed(2)}</span>`; divC.appendChild(card); }
            });
        }
        async function status(id, st) { await fetch('/api/pedidos/' + id + '/status', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ novoStatus: st }) }); load(); }
        setInterval(load, 4000); load();
    </script>
</body>
</html>
