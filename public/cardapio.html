<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital - Anota AI Style</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Esconde a barra de rolagem horizontal das categorias */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 pb-36 text-gray-800">

    <!-- Cabeçalho Estilo Anota AI (Clean com Informações) -->
    <header class="bg-white p-5 text-center border-b border-gray-200 shadow-xs relative">
        <div class="w-20 h-20 bg-red-600 rounded-full mx-auto flex items-center justify-center text-white text-3xl font-black shadow-md border-4 border-white -mb-2">
            BH
        </div>
        <h1 class="text-xl font-extrabold text-gray-900 mt-4 tracking-tight">BURGER HOUSE</h1>
        
        <!-- Status e Tempo de Entrega -->
        <div class="flex justify-center items-center space-x-4 mt-2 text-xs font-semibold text-gray-500">
            <span class="flex items-center text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
                Aberto
            </span>
            <span>•</span>
            <span>🕒 35 - 50 min</span>
            <span>•</span>
            <span>🛵 R\$ 7,00</span>
        </div>

        <!-- Carrossel de Categorias Fixo (Navegação Rápida) -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar mt-5 px-2 scroll-smooth">
            <a href="#sec-Burgers" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap shadow-xs">🍔 Burgers</a>
            <a href="#sec-Acompanhamentos" class="bg-white text-gray-600 border border-gray-200 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">🍟 Acompanhamentos</a>
            <a href="#sec-Bebidas" class="bg-white text-gray-600 border border-gray-200 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">🥤 Bebidas</a>
        </div>
    </header>

    <!-- Corpo do Menu -->
    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Seção: Burgers -->
        <section id="sec-Burgers" class="space-y-3">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-wider pl-1">Burgers Artesanais</h2>
            <div id="cat-Burgers" class="space-y-2"></div>
        </section>

        <!-- Seção: Acompanhamentos -->
        <section id="sec-Acompanhamentos" class="space-y-3">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-wider pl-1">Acompanhamentos</h2>
            <div id="cat-Acompanhamentos" class="space-y-2"></div>
        </section>

        <!-- Seção: Bebidas -->
        <section id="sec-Bebidas" class="space-y-3">
            <h2 class="text-xs font-black text-gray-400 uppercase tracking-wider pl-1">Bebidas Geladas</h2>
            <div id="cat-Bebidas" class="space-y-2"></div>
        </section>

        <!-- Formulário de Entrega Integrado Anota AI -->
        <section class="bg-white p-5 rounded-2xl border border-gray-200 shadow-xs space-y-4">
            <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wide border-b pb-2">📍 Finalizar para Entrega</h2>
            <div class="space-y-3">
                <input type="text" id="c-nome" placeholder="Seu Nome Completo" class="w-full border border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:outline-none focus:border-red-500 transition-all font-medium">
                <input type="tel" id="c-whats" placeholder="WhatsApp com DDD (Apenas números)" class="w-full border border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:outline-none focus:border-red-500 transition-all font-medium">
                <textarea id="c-end" placeholder="Rua, Número, Bairro e Ponto de Referência" class="w-full border border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:outline-none focus:border-red-500 transition-all font-medium" rows="2"></textarea>
            </div>
        </section>
    </main>

    <!-- Sacola Inferior Identica ao Anota AI -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-xl max-w-md mx-auto rounded-t-2xl flex justify-between items-center z-50">
        <div class="flex items-center space-x-2">
            <div class="bg-red-100 text-red-600 w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm" id="bag-count">
                0
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase">Total com taxa</p>
                <p class="text-xl font-black text-gray-900 tracking-tight" id="txt-total">R\$ 7,00</p>
            </div>
        </div>
        <button onclick="fazerPedido()" class="bg-red-600 hover:bg-red-700 text-white font-extrabold py-3.5 px-6 rounded-xl transition-all text-sm flex items-center space-x-1.5 shadow-sm shadow-red-600/10">
            <span>Ver Sacola</span>
            <span>➔</span>
        </button>
    </footer>

    <script>
        let produtos = []; let carrinho = {}; const TAXA = 7.00;
        
        async function carregarCardapio() {
            const res = await fetch('/api/produtos'); produtos = await res.json();
            
            produtos.forEach(p => {
                const container = document.getElementById('cat-' + (p.categoria || "Burgers"));
                if(container) {
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border border-gray-100 flex justify-between items-center shadow-xs">
                            <div class="flex-1 pr-3">
                                <h3 class="font-bold text-gray-900 text-sm">${p.nome}</h3>
                                <p class="text-xs text-gray-400 mt-0.5 leading-tight line-clamp-2">${p.descricao || 'Item preparado com ingredientes selecionados.'}</p>
                                <p class="text-gray-900 font-black mt-2 text-sm">R$ ${p.preco.toFixed(2)}</p>
                            </div>
                            <div class="flex items-center space-x-2 bg-gray-50 p-1 rounded-lg border">
                                <button onclick="mudarQtd(${p.id},-1)" class="w-7 h-7 rounded-md bg-white border text-gray-600 font-bold flex items-center justify-center shadow-xs">-</button>
                                <span id="qtd-${p.id}" class="font-bold text-xs w-4 text-center">0</span>
                                <button onclick="mudarQtd(${p.id},1)" class="w-7 h-7 rounded-md bg-red-600 text-white font-bold flex items-center justify-center shadow-xs">+</button>
                            </div>
                        </div>`;
                }
            });
        }

        function mudarQtd(id, delta) {
            carrinho[id] = (carrinho[id] || 0) + delta; if(carrinho[id] < 0) carrinho[id] = 0;
            document.getElementById('qtd-' + id).innerText = carrinho[id];
            
            let sub = 0; let totalItens = 0;
            produtos.forEach(p => {
                const qtd = carrinho[p.id] || 0;
                sub += qtd * p.preco;
                totalItens += qtd;
            });
            
            document.getElementById('bag-count').innerText = totalItens;
            document.getElementById('txt-total').innerText = 'R\$ ' + (sub > 0 ? sub + TAXA : TAXA).toFixed(2);
        }

        async function fazerPedido() {
            const n = document.getElementById('c-nome').value.trim();
            const w = document.getElementById('c-whats').value.trim();
            const e = document.getElementById('c-end').value.trim();
            
            let sub = 0; const its = []; 
            produtos.forEach(p => { 
                const q = carrinho[p.id] || 0; 
                if(q > 0) { 
                    sub += p.preco * q; 
                    its.push({ produto_id: p.id, nome_produto: p.nome, quantity: q, preco_unitario: p.preco }); 
                } 
            });

            if(!n || !w || !e || its.length === 0) {
                return alert("⚠️ Selecione os itens e preencha o seu endereço para entrega!");
            }

            await fetch('/api/pedidos', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ cliente_nome: n, cliente_whatsapp: w, endereco_entrega: e, taxa_entrega: TAXA, subtotal: sub, total: sub+TAXA, itens: its }) 
            });

            alert("✅ Pedido enviado! Acompanhe o preparo com o atendente."); 
            location.reload();
        }
        
        carregarCardapio();
    </script>
</body>
</html>
